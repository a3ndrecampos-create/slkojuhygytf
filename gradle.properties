# Project-wide Gradle settings.

# AndroidX package structure to make it clearer which packages are bundled
# with the Android operating system, and which are packaged with your app's APK.
android.useAndroidX=true

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself, with no unnecessary
# inheritance from its dependencies.
android.nonTransitiveRClass=true

# Kotlin code style for this project.
kotlin.code.style=official

# Enables incremental annotation processing.
kapt.incremental.apt=true

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# AndroidX libraries to use SDK 35 without triggering a compileSdk warning as build error.
android.suppressUnsupportedCompileSdk=35
